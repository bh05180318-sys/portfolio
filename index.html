                icon: "fa-lightbulb",
                color: "card-purple",
                links: [{ label: "과제물 보기", url: "./AI_test/index.html" }],
                description: "15주간의 AI 기술 및 데이터를 종합 융합하여, 현실 세계의 문제를 발굴하고 인공지능 기법을 통한 최적의 아키텍처 및 해결안을 도출한 종합 성과 과제입니다.",
                achievements: [
                    { title: "인공지능 융합 솔루션 설계", desc: "문제를 정량적으로 파악하고 AI Agent 기법을 이용한 시나리오 및 개선안 완성" },
                    { title: "프로토타입 가시화 성과", desc: "다차원 변수 분석 결과와 UI 디자인 시스템을 통합한 프로토타입 제시" }
                ],
                tools: ["ChatGPT-4o", "Claude 3.5", "Figma", "Canva"],
                category: "실습 및 기획"
            }
        ];

        const listView = document.getElementById('list-view');
        const detailView = document.getElementById('detail-view');
        const backBtn = document.getElementById('back-btn');
        const projectContainer = document.getElementById('project-container');
        const bottomActionContainer = document.getElementById('bottom-action-container');
        const bottomHelperText = document.getElementById('bottom-helper-text');

        const authorModal = document.getElementById('author-modal');
        const authorModalContent = document.getElementById('author-modal-content');
        const openModalBtn = document.getElementById('open-author-modal');
        const closeModalBtn = document.getElementById('close-author-modal');

        let currentActiveId = null;

        function toggleModal(show) {
            if (show) {
                authorModal.classList.remove('invisible');
                authorModal.classList.add('opacity-100');
                authorModalContent.classList.remove('scale-90', 'opacity-0');
                authorModalContent.classList.add('scale-100', 'opacity-100');
            } else {
                authorModal.classList.remove('opacity-100');
                authorModal.classList.add('invisible');
                authorModalContent.classList.remove('scale-100', 'opacity-100');
                authorModalContent.classList.add('scale-90', 'opacity-0');
            }
        }

        openModalBtn.onclick = () => toggleModal(true);
        closeModalBtn.onclick = () => toggleModal(false);
        authorModal.onclick = (e) => { if(e.target === authorModal) toggleModal(false); };

        function showDetail(projectId) {
            const project = projects.find(p => p.id === projectId);
            if (!project) return;

            // Render Links
            bottomActionContainer.innerHTML = '';
            if (project.links && project.links.length > 0) {
                bottomActionContainer.classList.remove('hidden');
                bottomHelperText.classList.remove('hidden');
                project.links.forEach((link, index) => {
                    const btn = document.createElement('a');
                    btn.href = link.url;
                    
                    // Assign gradients based on the number of buttons
                    let gradientClass = 'from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700';
                    if (project.links.length > 1) {
                        gradientClass = index === 0 
                            ? 'from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700' 
                            : 'from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700';
                    } else if (project.id === 6 || project.id === 8) {
                        // Cyan/Blue gradient for Data Analysis 2 & 일일박스오피스
                        gradientClass = 'from-cyan-600 to-blue-600 hover:from-cyan-700 hover:to-blue-700';
                    } else if (project.id === 9) {
                        // Purple/Indigo gradient for Task 9
                        gradientClass = 'from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700';
                    }
                    
                    btn.className = `flex items-center justify-center gap-4 w-full py-5 px-8 bg-gradient-to-r ${gradientClass} text-white rounded-[2rem] font-black text-lg shadow-xl transform hover:scale-[1.01] active:scale-[0.99] transition-all group`;
                    btn.innerHTML = `
                        <i class="fa-solid ${index === 0 ? 'fa-rocket' : 'fa-lightbulb'} text-lg group-hover:animate-bounce"></i>
                        <span>${link.label}</span>
                        <i class="fa-solid fa-arrow-right ml-2 group-hover:translate-x-2 transition-transform"></i>
                    `;
                    bottomActionContainer.appendChild(btn);
                });
            } else {
                bottomActionContainer.classList.add('hidden');
                bottomHelperText.classList.add('hidden');
            }

            // Fill content
            document.getElementById('detail-task-id').innerText = `TASK ${String(project.id).padStart(2, '0')}`;
            document.getElementById('detail-title').innerText = project.title;
            document.getElementById('detail-description').innerText = project.description;
            document.getElementById('detail-category').innerText = project.category;

            // Set accent color
            const dummy = document.createElement('div');
            dummy.className = project.color;
            document.body.appendChild(dummy);
            const projectAccent = getComputedStyle(dummy).getPropertyValue('--accent');
            document.body.removeChild(dummy);
            document.getElementById('detail-header').style.backgroundColor = `rgb(${projectAccent})`;

            // Tags & Achievements
            document.getElementById('detail-tags').innerHTML = project.tags.map(t => `<span class="px-2 py-1 rounded bg-white/20 text-[9px] font-bold uppercase">#${t}</span>`).join('');
            document.getElementById('detail-achievements').innerHTML = project.achievements.map(a => `
                <div class="p-5 rounded-2xl bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 flex gap-4">
                    <div class="w-8 h-8 rounded-full bg-emerald-500/10 text-emerald-500 flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-check text-xs"></i>
                    </div>
                    <div>
                        <h4 class="font-bold text-sm mb-1">${a.title}</h4>
                        <p class="text-xs text-slate-500 dark:text-slate-400">${a.desc}</p>
                    </div>
                </div>
            `).join('');

            document.getElementById('detail-tools').innerHTML = project.tools.map(t => `<span class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-white/10 text-[10px] font-bold text-slate-600 dark:text-slate-300">${t}</span>`).join('');

            // Transition
            listView.classList.remove('view-active');
            listView.classList.add('view-hidden');
            detailView.classList.remove('view-hidden');
            detailView.classList.add('view-active');
            backBtn.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showList() {
            detailView.classList.remove('view-active');
            detailView.classList.add('view-hidden');
            listView.classList.remove('view-hidden');
            listView.classList.add('view-active');
            backBtn.classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderCards() {
            projectContainer.innerHTML = '';
            projects.forEach(p => {
                const card = document.createElement('div');
                card.className = `project-card ${p.color} bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-[2.5rem] p-4 cursor-pointer group shadow-sm`;
                
                card.innerHTML = `
                    <div class="h-48 rounded-[2rem] bg-slate-100 dark:bg-white/5 mb-6 flex items-center justify-center relative overflow-hidden">
                        <div class="absolute inset-0 opacity-10 group-hover:opacity-20 transition-opacity bg-[radial-gradient(circle_at_center,_rgba(var(--accent),0.4)_0%,_transparent_70%)]"></div>
                        <i class="fa-solid ${p.icon} text-5xl text-slate-300 dark:text-slate-800 transition-all duration-500 group-hover:scale-110" style="color: rgba(var(--accent), 0.3)"></i>
                    </div>
                    <div class="px-4 pb-4">
                        <h3 class="text-xl font-black mb-3 text-slate-900 dark:text-white group-hover:text-blue-500 transition-colors leading-tight">${p.title}</h3>
                        <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 mb-6">${p.description}</p>
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] font-black uppercase text-slate-400">Task ${p.id}</span>
                            <div class="w-10 h-10 rounded-full bg-slate-100 dark:bg-white/5 flex items-center justify-center text-slate-400 group-hover:bg-blue-600 group-hover:text-white transition-all">
                                <i class="fa-solid fa-arrow-right"></i>
                            </div>
                        </div>
                    </div>
                `;

                card.onclick = () => showDetail(p.id);
                projectContainer.appendChild(card);
            });
        }

        renderCards();
        backBtn.onclick = showList;

        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const html = document.documentElement;

        function updateTheme(isDark) {
            html.classList.toggle('dark', isDark);
            themeIcon.className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        themeToggle.addEventListener('click', () => updateTheme(!html.classList.contains('dark')));
        updateTheme(localStorage.getItem('theme') !== 'light');
    </script>
</body>
</html>
